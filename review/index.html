<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>测试方案评审</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
  :root {
    --bg: #f3f5f8; --panel: #fff; --border: #e1e5eb; --text: #172033;
    --muted: #697386; --accent: #4f46e5; --accent-soft: #eef2ff; --accent-fg: #fff;
    --ok: #16834a; --ok-soft: #eaf8f0; --warn: #b15c00; --shadow: 0 8px 28px rgba(23,32,51,.07);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); height: 100vh; display: flex; }
  button, textarea { color: inherit; }
  h1, h2, h3 { margin: 0; }

  #sidebar {
    width: 310px; flex: none; background: #f9fafc; border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow-y: auto;
  }
  .resizer { flex: none; position: relative; z-index: 5; width: 7px; margin: 0 -3px; cursor: col-resize; touch-action: none; }
  .resizer::after { content: ""; position: absolute; inset: 0 3px; background: transparent; transition: background .15s, box-shadow .15s; }
  .resizer:hover::after, .resizer.dragging::after, .resizer:focus-visible::after { background: var(--accent); box-shadow: 0 0 0 2px rgba(79,70,229,.12); }
  .resizer:focus-visible { outline: none; }
  body.resizing { cursor: col-resize; user-select: none; }
  #sidebar header { padding: 24px 18px 18px; border-bottom: 1px solid var(--border); background: var(--panel); }
  #sidebar header h1 { font-size: 21px; letter-spacing: -.02em; }
  #sidebar header p { margin: 7px 0 14px; font-size: 13px; line-height: 1.5; color: var(--muted); }
  .eyebrow { margin: 0 0 5px !important; color: var(--accent) !important; font-size: 10px !important; font-weight: 750; letter-spacing: .12em; }
  .group { padding: 14px 10px 2px; }
  .group > .label {
    font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
    padding: 4px 9px 7px; display: flex; justify-content: space-between; font-weight: 700;
  }
  .count { min-width: 21px; padding: 1px 6px; border-radius: 99px; background: #e9edf3; text-align: center; }
  .file { padding: 10px 11px; margin-bottom: 3px; border: 1px solid transparent; border-radius: 9px; cursor: pointer; font-size: 13px; word-break: break-all; transition: .15s ease; }
  .file:hover { background: var(--panel); border-color: var(--border); transform: translateX(2px); }
  .file.active { background: var(--accent-soft); border-color: #cfd3ff; color: #3730a3; box-shadow: 0 2px 8px rgba(79,70,229,.08); }
  .file .tag { font-size: 10px; color: var(--muted); }
  .file.active .tag { color: #3b82f6; }
  .file .meta { display: flex; align-items: center; gap: 5px; }
  .file .relTag { font-size: 10px; color: var(--accent); cursor: help; }
  .empty { padding: 6px 10px; font-size: 12px; color: var(--muted); font-style: italic; }

  .paneHeaderRight { display: flex; align-items: center; gap: 10px; }
  #btnInsertRef { min-height: 26px; padding: 3px 10px; font-size: 12px; font-weight: 600; text-transform: none; letter-spacing: 0; color: var(--accent); border-color: #cfd3ff; background: var(--accent-soft); }
  #btnInsertRef:hover:not(:disabled) { background: #e0e4ff; }

  #refDropdown {
    position: fixed; z-index: 50; width: 300px; max-height: 340px; display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden;
  }
  #refDropdown input {
    margin: 8px; padding: 7px 10px; border: 1px solid var(--border); border-radius: 7px; font: inherit; font-size: 13px;
  }
  #refDropdown input:focus-visible { outline: 3px solid rgba(79,70,229,.22); outline-offset: 1px; }
  #refList { overflow-y: auto; padding: 0 6px 8px; }
  .refItem { padding: 7px 9px; border-radius: 7px; cursor: pointer; font-size: 13px; line-height: 1.4; }
  .refItem:hover, .refItem:focus-visible { background: var(--accent-soft); outline: none; }
  .refItem .reqId { display: block; color: var(--accent); font-weight: 700; font-size: 11px; }
  .refEmpty { padding: 10px 12px; font-size: 12px; color: var(--muted); font-style: italic; }

  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #toolbar {
    min-height: 76px; padding: 12px 24px; background: var(--panel); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  #toolbar .path { font-weight: 700; font-size: 14px; margin-right: auto; min-width: 180px; }
  #toolbar .hint { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; font-weight: 400; }
  #toolbar .dirty { color: var(--warn); font-size: 12px; }
  button {
    font: inherit; font-weight: 600; font-size: 13px; min-height: 36px; padding: 7px 13px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel); cursor: pointer; transition: background .15s, border-color .15s, box-shadow .15s, transform .1s;
  }
  button:hover:not(:disabled) { background: #f2f4f7; border-color: #cbd1da; }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:focus-visible, textarea:focus-visible, .file:focus-visible { outline: 3px solid rgba(79,70,229,.22); outline-offset: 2px; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); box-shadow: 0 3px 10px rgba(79,70,229,.18); }
  button.primary:hover:not(:disabled) { background: #4338ca; border-color: #4338ca; }
  button.approve { background: var(--ok); border-color: var(--ok); color: #fff; box-shadow: 0 3px 10px rgba(22,131,74,.16); }
  button.approve:hover:not(:disabled) { background: #116b3c; border-color: #116b3c; }

  #panes { flex: 1; display: flex; min-height: 0; background: var(--border); }
  .pane { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--panel); }
  .paneHeader { height: 42px; flex: none; padding: 0 18px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); color: var(--muted); font-size: 11px; font-weight: 750; letter-spacing: .06em; text-transform: uppercase; }
  .paneHeader span { font-weight: 500; letter-spacing: 0; text-transform: none; }
  #editor, #preview { flex: 1; min-width: 0; overflow: auto; }
  #editor {
    border: none; resize: none; padding: 16px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    width: 100%; font-size: 14px; line-height: 1.65; background: #fbfcfe;
  }
  #preview { padding: 26px 34px 60px; background: var(--panel); line-height: 1.72; }
  #preview h1 { font-size: 28px; letter-spacing: -.025em; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
  #preview h2 { font-size: 20px; margin-top: 30px; } #preview h3 { font-size: 16px; margin-top: 24px; }
  #preview p, #preview li { color: #354052; }
  #preview > :first-child { margin-top: 0; }
  #preview table { border-collapse: collapse; font-size: 13px; display: block; overflow-x: auto; }
  #preview th, #preview td { border: 1px solid var(--border); padding: 6px 9px; text-align: left; vertical-align: top; }
  #preview code { background: #eef1f5; padding: 1px 4px; border-radius: 4px; }
  #preview pre { background: #1c2530; color: #e6edf3; padding: 12px; border-radius: 8px; overflow-x: auto; }
  #preview pre code { background: none; color: inherit; }
  #placeholder { margin: auto; color: var(--muted); font-size: 14px; }
  #toast {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: #172033; color: #fff; padding: 10px 16px; border-radius: 9px; font-size: 13px;
    opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; box-shadow: var(--shadow);
  }
  #toast.show { opacity: 1; }
  #btnAiRevise { color: #7c3aed; border-color: #ddd0fb; background: #f5f0ff; }
  #btnAiRevise:hover:not(:disabled) { background: #ebe2ff; border-color: #c9b6f7; }
  .revBadge { font-size: 10px; font-weight: 700; color: var(--warn); background: #fff4e0; border: 1px solid #f3d29b; border-radius: 99px; padding: 0 6px; cursor: help; }
  #revBanner { padding: 10px 24px; background: #fff8e8; border-bottom: 1px solid #f3d29b; color: #6b4300; font-size: 13px; }
  #revBanner .head { display: flex; align-items: center; gap: 10px; }
  #revBanner .head b { margin-right: auto; }
  #revBanner button { min-height: 28px; padding: 3px 10px; font-size: 12px; }
  #revBanner ul { margin: 8px 0 0; padding-left: 20px; max-height: 120px; overflow-y: auto; line-height: 1.6; }
  #revBanner code { background: #fdeccb; padding: 1px 4px; border-radius: 4px; }
  #preview tr.revised td { background: #fff8e8; }
  #preview tr.revised td:first-child { box-shadow: inset 3px 0 0 #e8a21c; }
  #preview tr.revised .revBadge { display: inline-block; margin-top: 4px; white-space: normal; }
  #ctxMenu { position: fixed; z-index: 60; min-width: 160px; padding: 4px; background: var(--panel); border: 1px solid var(--border); border-radius: 9px; box-shadow: var(--shadow); }
  #ctxMenu button { display: block; width: 100%; text-align: left; border: 0; background: none; min-height: 32px; font-weight: 500; }
  #ctxMenu button:hover:not(:disabled) { background: var(--accent-soft); }
  dialog { border: 1px solid var(--border); border-radius: 12px; padding: 20px; width: min(560px, calc(100vw - 32px)); box-shadow: var(--shadow); color: var(--text); }
  dialog::backdrop { background: rgba(23,32,51,.35); }
  dialog h2 { font-size: 18px; margin-bottom: 6px; }
  dialog p { margin: 0 0 12px; font-size: 13px; color: var(--muted); line-height: 1.5; }
  dialog textarea { width: 100%; min-height: 120px; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font: inherit; font-size: 14px; resize: vertical; }
  dialog .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  dialog ul { max-height: 240px; overflow-y: auto; font-size: 13px; line-height: 1.6; padding-left: 20px; }
  #viewSwitch { display: none; }
  @media (max-width: 760px) {
    body { display: block; } #sidebar { width: 100%; max-height: 42vh; border-right: 0; border-bottom: 1px solid var(--border); }
    .resizer { display: none; }
    #sidebar header { padding: 14px; } #sidebar header h1 { font-size: 18px; } #sidebar header > p:not(.eyebrow) { display: none; }
    #list { display: flex; overflow-x: auto; padding: 5px; } .group { min-width: 180px; padding: 4px; }
    #main { min-height: 58vh; } #toolbar { min-height: 58px; padding: 9px 12px; } #toolbar .path { flex: 1 1 100%; }
    #refDropdown { width: calc(100vw - 24px); left: 12px !important; right: 12px !important; }
    #viewSwitch { display: flex; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--panel); }
    #viewSwitch button { flex: 1; } #viewSwitch button.selected { color: #1d4ed8; background: #eff6ff; border-color: #bfdbfe; }
    #panes { gap: 0; } #panes.previewing .editorPane { display: none; } #panes.previewing .previewPane { display: flex; }
    .pane { flex: none; width: 100%; } .previewPane { display: none; } #editor, #preview { width: 100%; border-right: 0; } #preview { padding: 20px; }
  }
</style>
</head>
<body>
<aside id="sidebar">
  <header>
    <p class="eyebrow">TEST REVIEW</p>
    <h1>测试方案评审</h1>
    <p>编辑需求，检查测试方案；确认无误后批准，才会交给测试生成器。</p>
    <button id="btnNew" class="primary" style="width:100%">＋ 新建需求</button>
  </header>
  <div id="list"></div>
</aside>

<div id="sidebarResizer" class="resizer" role="separator" aria-label="调整文件栏宽度" aria-orientation="vertical" tabindex="0" title="拖动调整宽度，双击恢复默认"></div>

<section id="main">
  <div id="toolbar">
    <span class="path" id="curPath">请选择左侧文件<span class="hint" id="fileHint">从需求开始，或查看待评审的测试方案</span></span>
    <span class="dirty" id="dirty" hidden>● 有未保存修改</span>
    <button id="btnAiRevise" hidden>🤖 AI 修正</button>
    <button id="btnReload" disabled>还原修改</button>
    <button id="btnSave" class="primary" disabled>保存</button>
    <button id="btnApprove" class="approve" disabled hidden>批准并交给生成器</button>
    <button id="btnUnapprove" disabled hidden>退回待评审</button>
  </div>
  <div id="revBanner" hidden></div>
  <div id="viewSwitch"><button data-view="edit" class="selected">编辑</button><button data-view="preview">预览</button></div>
  <div id="panes" hidden>
    <div class="pane editorPane">
      <div class="paneHeader">Markdown 编辑<span class="paneHeaderRight"><button id="btnInsertRef" type="button" hidden>🔗 引用需求</button><span>支持 Ctrl / ⌘ + S 保存</span></span></div>
      <textarea id="editor" aria-label="Markdown 编辑器" spellcheck="false" placeholder="在这里编辑 Markdown 内容…"></textarea>
    </div>
    <div id="paneResizer" class="resizer" role="separator" aria-label="调整编辑和预览区域宽度" aria-orientation="vertical" tabindex="0" title="拖动调整宽度，双击恢复默认"></div>
    <div class="pane previewPane"><div class="paneHeader">实时预览<span>内容会随编辑同步</span></div><div id="preview"></div></div>
  </div>
</section>

<div id="refDropdown" hidden>
  <input id="refFilter" type="text" placeholder="搜索需求 id / 标题…" aria-label="搜索需求文档" />
  <div id="refList"></div>
</div>

<div id="ctxMenu" role="menu" hidden><button id="ctxAiRevise" role="menuitem" type="button">🤖 AI 修正</button></div>

<dialog id="aiDialog">
  <h2>🤖 AI 修正需求</h2>
  <p id="aiIntro">描述要如何修改这份需求。AI 会改写需求，并同步修正引用该需求的测试计划和用例；被改动的用例会被标记，等待你确认。修改前的原文件会备份到 specs/.ai-backups/。</p>
  <textarea id="aiInstruction" placeholder="例如：任务内容长度上限由 120 调整为 200 字符；新增「清空已完成」按钮…"></textarea>
  <div class="actions"><button id="aiCancel" type="button">取消</button><button id="aiRun" class="primary" type="button">开始修正</button></div>
</dialog>
<dialog id="aiResult">
  <h2>修正完成</h2>
  <p id="aiSummary"></p>
  <ul id="aiChanges"></ul>
  <div class="actions"><button id="aiResultClose" class="primary" type="button">知道了</button></div>
</dialog>

<div id="toast" role="status" aria-live="polite"></div>

<script>
marked.setOptions({ gfm: true, breaks: false });

const state = { path: null, saved: '', area: null, busy: false, reqIndex: [], revisions: {} }; // area: 'requirement' | 'draft' | 'approved'
const $ = (id) => document.getElementById(id);

// --- Requirement cross-linking ("引用需求") --------------------------------
// Clicking "🔗 引用需求" opens a searchable dropdown of the other requirement
// docs; picking one inserts an ordinary markdown link at the cursor. Any
// markdown link whose target resolves to another docs/*.md file counts as a
// reference — review/server.mjs's /api/requirements-index scans for these
// anywhere in the file, matching what the planner agent follows.
function refLabel(meta) {
  return [meta.reqId, meta.title].filter(Boolean).join(' ') || meta.path.replace(/^docs\//, '');
}

function insertRelatedLink(target) {
  const editor = $('editor');
  const label = refLabel(target);
  const linkText = `[${label}](${target.path.split('/').pop()})`;
  const start = editor.selectionStart ?? editor.value.length;
  const end = editor.selectionEnd ?? start;
  editor.value = editor.value.slice(0, start) + linkText + editor.value.slice(end);
  const newPos = start + linkText.length;
  renderPreview(); syncButtons();
  editor.focus();
  editor.setSelectionRange(newPos, newPos);
  toast(`已插入「${label}」的引用，记得保存`);
}

// Below this many candidates, skip the search box entirely — with only a
// handful of requirement docs, making the user type first (rather than just
// clicking one of the docs already visible in the list) is friction, not help.
const REF_SEARCH_THRESHOLD = 7;

function renderRefList(query) {
  const list = $('refList');
  list.innerHTML = '';
  const q = query.trim().toLowerCase();
  const others = state.reqIndex.filter((r) => r.path !== state.path);
  const matches = !q
    ? others
    : others.filter((r) => `${r.reqId} ${r.title} ${r.path}`.toLowerCase().includes(q));
  if (!others.length) {
    list.innerHTML = '<div class="refEmpty">项目里目前没有其他需求文档 —— 先在左侧「＋ 新建需求」创建一份，再来引用。</div>';
    return;
  }
  if (!matches.length) {
    list.innerHTML = '<div class="refEmpty">没有匹配的需求文档。</div>';
    return;
  }
  for (const r of matches) {
    const el = document.createElement('div');
    el.className = 'refItem';
    el.tabIndex = 0;
    el.innerHTML = `<span class="reqId">${r.reqId || ''}</span>${r.title || r.path.replace(/^docs\//, '')}`;
    const pick = () => { insertRelatedLink(r); closeRefDropdown(); };
    el.onclick = pick;
    el.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } };
    list.append(el);
  }
}

function onRefDropdownOutsideClick(e) {
  if (!$('refDropdown').contains(e.target) && e.target !== $('btnInsertRef')) closeRefDropdown();
}

function openRefDropdown() {
  const btn = $('btnInsertRef');
  const dd = $('refDropdown');
  const rect = btn.getBoundingClientRect();
  dd.style.top = rect.bottom + 6 + 'px';
  dd.style.right = window.innerWidth - rect.right + 'px';
  dd.hidden = false;
  const showSearch = state.reqIndex.length - 1 > REF_SEARCH_THRESHOLD;
  $('refFilter').hidden = !showSearch;
  $('refFilter').value = '';
  renderRefList('');
  if (showSearch) $('refFilter').focus();
  else $('refList').querySelector('.refItem, .refEmpty')?.focus();
  document.addEventListener('mousedown', onRefDropdownOutsideClick, true);
}

function closeRefDropdown() {
  $('refDropdown').hidden = true;
  document.removeEventListener('mousedown', onRefDropdownOutsideClick, true);
}

function docLabel(meta, fallbackPath) {
  if (!meta) return fallbackPath.replace(/^docs\//, '');
  return [meta.reqId, meta.title].filter(Boolean).join(' — ') || fallbackPath.replace(/^docs\//, '');
}

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 2200);
}

async function api(url, opts) {
  const res = await fetch(url, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function isDirty() { return state.path && $('editor').value !== state.saved; }

const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const planKeyOf = (p) => p.split('/').pop().replace(/\.cases\.md$/, '').replace(/\.md$/, '');
const CHANGE_LABEL = { modified: '已修改', added: '新增', removed: '已删除' };
const revisionsFor = () => (state.area === 'requirement' || !state.path ? [] : state.revisions[planKeyOf(state.path)] || []);

function renderPreview() {
  const preview = $('preview');
  preview.innerHTML = marked.parse($('editor').value || '*暂无内容*');
  // Flag table rows whose case_id was changed by an AI revision and not yet acknowledged.
  const byId = new Map(revisionsFor().map((r) => [r.caseId, r]));
  if (!byId.size) return;
  preview.querySelectorAll('tr').forEach((tr) => {
    const hit = [...tr.children].map((c) => byId.get(c.textContent.trim())).find(Boolean);
    if (!hit) return;
    tr.classList.add('revised');
    const badge = document.createElement('div');
    badge.className = 'revBadge';
    badge.title = `AI 修正（${hit.requirement}）：${hit.instruction}`;
    badge.textContent = `⚠ AI ${CHANGE_LABEL[hit.change]}：${hit.reason}`;
    tr.firstElementChild.append(badge);
  });
}

function renderRevBanner() {
  const revs = revisionsFor();
  const banner = $('revBanner');
  banner.hidden = !revs.length;
  if (!revs.length) return;
  banner.innerHTML = `<div class="head"><b>⚠ ${revs.length} 个用例被 AI 修正，请审阅后确认</b>
    <span>${state.area === 'approved' ? '已批准的方案被改动，需重新生成对应脚本' : '需求修改后同步变更'}</span>
    <button id="btnAck">全部已审阅</button></div>
    <ul>${revs.map((r) => `<li><code>${esc(r.caseId)}</code> ${CHANGE_LABEL[r.change]} —— ${esc(r.reason)}</li>`).join('')}</ul>`;
  $('btnAck').onclick = async () => {
    try {
      await api('/api/revisions/ack', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key: planKeyOf(state.path) }) });
      await loadList(); renderPreview(); renderRevBanner();
    } catch (e) { toast('操作失败：' + e.message); }
  };
}

function syncButtons() {
  const dirty = isDirty();
  $('dirty').hidden = !dirty;
  $('btnSave').disabled = !dirty || state.busy;
  $('btnReload').disabled = !state.path || !dirty || state.busy;
  $('btnAiRevise').hidden = state.area !== 'requirement';
  $('btnAiRevise').disabled = state.busy;
  $('btnApprove').hidden = state.area !== 'draft';
  $('btnApprove').disabled = dirty || state.busy;
  $('btnUnapprove').hidden = state.area !== 'approved';
  $('btnUnapprove').disabled = state.busy;
}

function setBusy(busy) {
  state.busy = busy;
  document.body.style.cursor = busy ? 'progress' : '';
  syncButtons();
}

async function loadList() {
  const [tree, reqIndex, revisions] = await Promise.all([api('/api/tree'), api('/api/requirements-index'), api('/api/revisions')]);
  state.reqIndex = reqIndex;
  state.revisions = revisions;
  const { requirements, drafts, approved } = tree;
  const wrap = $('list');
  wrap.innerHTML = '';
  wrap.append(groupEl('需求文档', requirements, 'requirement', '还没有需求文档。'));
  wrap.append(groupEl('待评审', drafts, 'draft', '暂无待评审的测试方案。'));
  wrap.append(groupEl('已批准', approved, 'approved', '暂无已批准的方案。'));
  return tree;
}

/** Requirement docs (excluding `f` itself) that `f` links to, or that link to `f`. */
function relationsFor(f) {
  const meta = state.reqIndex.find((r) => r.path === f);
  const out = (meta?.related || [])
    .filter((r) => r.path !== f)
    .map((r) => state.reqIndex.find((x) => x.path === r.path) || r);
  const inn = state.reqIndex.filter((r) => r.path !== f && (r.related || []).some((x) => x.path === f));
  return { out, inn };
}

function groupEl(label, files, area, emptyText) {
  const g = document.createElement('div');
  g.className = 'group';
  const l = document.createElement('div');
  l.className = 'label';
  l.innerHTML = `<span>${label}</span><span class="count">${files.length}</span>`;
  g.append(l);
  if (!files.length) {
    const e = document.createElement('div');
    e.className = 'empty';
    e.textContent = emptyText;
    g.append(e);
  }
  for (const f of files) {
    const el = document.createElement('div');
    el.className = 'file' + (f === state.path ? ' active' : '');
    el.tabIndex = 0;
    el.setAttribute('role', 'button');
    if (f === state.path) el.setAttribute('aria-current', 'true');
    const kind = area === 'requirement' ? '需求文档' : f.endsWith('.cases.md') ? '测试用例表' : '测试计划';
    let relTag = '';
    if (area === 'requirement') {
      const { out, inn } = relationsFor(f);
      if (out.length || inn.length) {
        const lines = [
          ...out.map((r) => `→ ${docLabel(r, r.path)}`),
          ...inn.map((r) => `← ${docLabel(r, r.path)}`),
        ];
        relTag = `<span class="relTag" title="${lines.join('\n').replace(/"/g, '&quot;')}">🔗${out.length + inn.length}</span>`;
      }
    }
    const revN = area === 'requirement' ? 0 : (state.revisions[planKeyOf(f)] || []).length;
    if (revN) relTag += `<span class="revBadge" title="${revN} 个用例被 AI 修正，待审阅">⚠ ${revN}</span>`;
    el.innerHTML = `<div>${f.replace(/^(specs|docs)\//, '')}</div><span class="meta"><span class="tag">${kind}</span>${relTag}</span>`;
    el.onclick = () => openFile(f, area);
    if (area === 'requirement') el.oncontextmenu = (e) => { e.preventDefault(); showCtxMenu(e, f); };
    el.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openFile(f, area); } };
    g.append(el);
  }
  return g;
}

async function openFile(p, area) {
  if (isDirty() && !confirm('当前修改尚未保存，确定放弃这些修改吗？')) return;
  try {
    const { content } = await api('/api/file?path=' + encodeURIComponent(p));
    state.path = p; state.saved = content; state.area = area;
    $('editor').value = content; $('curPath').firstChild.textContent = p;
    $('fileHint').textContent = area === 'requirement' ? '需求文档' : area === 'draft' ? '待评审的测试方案' : '已批准的生成器输入';
    $('panes').hidden = false;
    $('btnInsertRef').hidden = area !== 'requirement';
    closeRefDropdown();
    renderPreview(); renderRevBanner(); syncButtons(); loadList();
  } catch (e) { toast('打开失败：' + e.message); }
}

async function save() {
  try {
    setBusy(true);
    await api('/api/file', {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: state.path, content: $('editor').value }),
    });
    state.saved = $('editor').value;
    toast('✓ 修改已保存');
    await loadList();
  } catch (e) { toast('保存失败：' + e.message); }
  finally { setBusy(false); }
}

async function move(action) {
  if (isDirty()) return toast('请先保存修改');
  if (!confirm(action === 'approve' ? '批准后，测试计划及其用例表会成为生成器的输入。确定批准吗？' : '确定将此方案退回到待评审状态吗？')) return;
  try {
    setBusy(true);
    await api('/api/' + action, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: state.path }),
    });
    toast(action === 'approve' ? '✓ 已批准，可交给生成器' : '已退回待评审');
    state.area = action === 'approve' ? 'approved' : 'draft';
    const isCases = state.path.endsWith('.cases.md');
    const base = state.path.split('/').pop().replace(/\.cases\.md$/, '').replace(/\.md$/, '');
    state.path = `specs/${state.area === 'approved' ? 'approved/' : ''}${base}${isCases ? '.cases' : ''}.md`;
    $('curPath').firstChild.textContent = state.path;
    $('fileHint').textContent = state.area === 'approved' ? '已批准的生成器输入' : '待评审的测试方案';
    await loadList();
  } catch (e) { toast('操作失败：' + e.message); }
  finally { setBusy(false); }
}

async function newRequirement() {
  const title = prompt('请输入需求标题：');
  if (!title || !title.trim()) return;
  const { path: p } = await api('/api/new-requirement', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ title: title.trim() }),
  });
  await loadList();
  openFile(p, 'requirement');
}

$('editor').addEventListener('input', () => { renderPreview(); syncButtons(); });
$('btnInsertRef').onclick = () => { if ($('refDropdown').hidden) openRefDropdown(); else closeRefDropdown(); };
$('refFilter').addEventListener('input', () => renderRefList($('refFilter').value));
$('refFilter').addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeRefDropdown(); $('btnInsertRef').focus(); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); $('refList').querySelector('.refItem')?.focus(); }
});
async function runAiRevise() {
  const instruction = $('aiInstruction').value.trim();
  if (!instruction) return toast('请先填写修正要求');
  const run = $('aiRun');
  run.disabled = true; run.textContent = 'AI 修正中…（可能需要几分钟）';
  setBusy(true);
  try {
    const r = await api('/api/ai-revise', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: state.path, instruction }),
    });
    $('aiDialog').close(); $('aiInstruction').value = '';
    state.saved = r.requirement; $('editor').value = r.requirement;
    await loadList(); renderPreview();
    const cases = r.files.flatMap((f) => f.cases.map((c) => ({ ...c, file: f.path })));
    $('aiSummary').textContent = `${r.summary}（原文件已备份：${r.backup}）`;
    $('aiChanges').innerHTML = cases.length
      ? cases.map((c) => `<li><code>${esc(c.caseId)}</code> ${CHANGE_LABEL[c.change]} —— ${esc(c.reason)}<br><small>${esc(c.file)}</small></li>`).join('')
      : '<li>没有用例受影响。</li>';
    $('aiResult').showModal();
  } catch (e) { toast('AI 修正失败：' + e.message); }
  finally { run.disabled = false; run.textContent = '开始修正'; setBusy(false); }
}
// Opens the AI revision dialog for the open requirement (guards against unsaved edits).
function openAiDialog() {
  if (state.area !== 'requirement') return;
  if (isDirty()) return toast('请先保存修改，再使用 AI 修正');
  $('aiDialog').showModal();
}
let ctxTarget = null;
function showCtxMenu(e, reqPath) {
  ctxTarget = reqPath;
  const m = $('ctxMenu');
  m.hidden = false;
  m.style.left = Math.min(e.clientX, window.innerWidth - 180) + 'px';
  m.style.top = Math.min(e.clientY, window.innerHeight - 50) + 'px';
}
const hideCtxMenu = () => { $('ctxMenu').hidden = true; };
$('ctxAiRevise').onclick = async () => {
  const target = ctxTarget; hideCtxMenu();
  if (target !== state.path) await openFile(target, 'requirement');
  if (state.path === target) openAiDialog();
};
document.addEventListener('click', hideCtxMenu);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hideCtxMenu(); });
// Right-click in the detail preview offers the same action (the editor keeps its native menu).
$('preview').addEventListener('contextmenu', (e) => {
  if (state.area !== 'requirement') return;
  e.preventDefault(); showCtxMenu(e, state.path);
});
$('btnAiRevise').onclick = openAiDialog;
$('aiCancel').onclick = () => $('aiDialog').close();
$('aiRun').onclick = runAiRevise;
$('aiResultClose').onclick = () => $('aiResult').close();
$('btnSave').onclick = save;
$('btnNew').onclick = () => newRequirement().catch((e) => toast(e.message));
$('btnReload').onclick = () => state.path && openFile(state.path, state.area);
$('btnApprove').onclick = () => move('approve');
$('btnUnapprove').onclick = () => move('unapprove');
window.addEventListener('beforeunload', (e) => { if (isDirty()) e.preventDefault(); });
document.addEventListener('keydown', (e) => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); if (isDirty()) save(); } });
document.querySelectorAll('[data-view]').forEach((button) => button.onclick = () => {
  document.querySelectorAll('[data-view]').forEach((b) => b.classList.toggle('selected', b === button));
  $('panes').classList.toggle('previewing', button.dataset.view === 'preview');
});

function makeResizable(handle, onMove, onReset, onKey) {
  handle.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    e.preventDefault();
    handle.setPointerCapture(e.pointerId);
    handle.classList.add('dragging');
    document.body.classList.add('resizing');
    onMove(e.clientX);
  });
  handle.addEventListener('pointermove', (e) => {
    if (handle.hasPointerCapture(e.pointerId)) onMove(e.clientX);
  });
  const stop = (e) => {
    if (handle.hasPointerCapture(e.pointerId)) handle.releasePointerCapture(e.pointerId);
    handle.classList.remove('dragging');
    document.body.classList.remove('resizing');
  };
  handle.addEventListener('pointerup', stop);
  handle.addEventListener('pointercancel', stop);
  handle.addEventListener('dblclick', onReset);
  handle.addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    e.preventDefault();
    onKey(e.key === 'ArrowRight' ? 20 : -20);
  });
}

const sidebar = $('sidebar');
const editorPane = document.querySelector('.editorPane');
makeResizable(
  $('sidebarResizer'),
  (x) => { sidebar.style.width = Math.max(220, Math.min(480, x)) + 'px'; },
  () => { sidebar.style.width = '310px'; },
  (delta) => { sidebar.style.width = Math.max(220, Math.min(480, sidebar.getBoundingClientRect().width + delta)) + 'px'; },
);
makeResizable(
  $('paneResizer'),
  (x) => {
    const box = $('panes').getBoundingClientRect();
    const width = Math.max(260, Math.min(box.width - 260, x - box.left));
    editorPane.style.flex = `0 0 ${width}px`;
  },
  () => { editorPane.style.flex = '1 1 0'; },
  (delta) => {
    const box = $('panes').getBoundingClientRect();
    const width = Math.max(260, Math.min(box.width - 260, editorPane.getBoundingClientRect().width + delta));
    editorPane.style.flex = `0 0 ${width}px`;
  },
);

async function initialize() {
  const { requirements, drafts, approved } = await loadList();
  if (drafts[0]) await openFile(drafts[0], 'draft');
  else if (requirements[0]) await openFile(requirements[0], 'requirement');
  else if (approved[0]) await openFile(approved[0], 'approved');
}

initialize().catch((e) => toast('加载失败：' + e.message));
</script>
