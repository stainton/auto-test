apiVersion: apps/v1
kind: Deployment
metadata:
  name: planner
spec:
  # A planner pod is a stateless node: CaseHub owns every task's record and hands tasks to idle pods, so any
  # number of replicas can run and roll over side by side. Fixed here; components/autoscaling sizes it to the queue.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: auto-test-planner
  template:
    metadata:
      labels:
        app: auto-test-planner
    spec:
      # On SIGTERM the node stops taking tasks (readiness turns 503, so it leaves planner-nodes), lets the running
      # one finish for up to PLANNER_DRAIN_TIMEOUT_MS, then waits up to PLANNER_DRAIN_HOLD_MS for CaseHub to collect
      # it. A run cut off by the drain limit stays continuable from its checkpoint. Keep this above the sum.
      terminationGracePeriodSeconds: 990
      containers:
        - name: planner
          image: auto-test-planner:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4501
          env:
            - name: PLANNER_CONCURRENCY
              value: '1'
            - name: PLANNER_TIMEOUT_MS
              value: '900000'
            - name: PLANNER_MAX_JOBS
              value: '100'
            - name: PLANNER_RETENTION_MS
              value: '86400000'
            - name: PLANNER_DRAIN_TIMEOUT_MS
              value: '900000'
            - name: PLANNER_DRAIN_HOLD_MS
              value: '60000'
            # Scratch only: task workspaces (cleared on start) and the asset cache.
            - name: PLANNER_ASSET_DIR
              value: /var/lib/planner/assets
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          resources:
            requests:
              cpu: '1'
              memory: 1Gi
              ephemeral-storage: 1Gi
            limits:
              cpu: '2'
              memory: 3Gi
              ephemeral-storage: 6Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/planner
            - name: shared-memory
              mountPath: /dev/shm
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 4Gi
        - name: shared-memory
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
---
# One address for the planner (debugging, port-forward, a CaseHub with a fixed URL).
apiVersion: v1
kind: Service
metadata:
  name: planner
spec:
  selector:
    app: auto-test-planner
  ports:
    - name: http
      port: 4501
      targetPort: http
  type: ClusterIP
---
# Every ready planner pod: CaseHub resolves this name (CASEHUB_PLANNER_URL=dns+http://planner-nodes:4501) to pick
# an idle node itself. A draining pod is not ready, so it drops out before it stops.
apiVersion: v1
kind: Service
metadata:
  name: planner-nodes
spec:
  clusterIP: None
  selector:
    app: auto-test-planner
  ports:
    - name: http
      port: 4501
      targetPort: http
