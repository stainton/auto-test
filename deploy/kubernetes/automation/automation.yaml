apiVersion: apps/v1
kind: Deployment
metadata:
  name: automation
spec:
  # Planner, generator and healer in one process. Stateless like the separate nodes, so it may run more than one
  # replica too; CaseHub then reaches them through automation-nodes.
  replicas: 1
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app: auto-test-automation } }
  template:
    metadata: { labels: { app: auto-test-automation } }
    spec:
      # SIGTERM: finish running tasks (AUTOMATION_DRAIN_TIMEOUT_MS), let CaseHub collect them (AUTOMATION_DRAIN_HOLD_MS).
      terminationGracePeriodSeconds: 3690
      containers:
        - name: automation
          image: auto-test-automation:local
          ports: [{ name: http, containerPort: 4501 }]
          env:
            - { name: AUTOMATION_DRAIN_TIMEOUT_MS, value: '3600000' }
            - { name: AUTOMATION_DRAIN_HOLD_MS, value: '60000' }
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: http } }
          resources:
            requests: { cpu: '1', memory: 1Gi }
            limits: { cpu: '2', memory: 3Gi }
          volumeMounts:
            # Scratch only: task workspaces (cleared on start), the asset cache and the healer's settings file.
            - { name: data, mountPath: /var/lib/automation }
            - { name: shared-memory, mountPath: /dev/shm }
      volumes:
        - name: data
          emptyDir: { sizeLimit: 4Gi }
        - name: shared-memory
          emptyDir: { medium: Memory, sizeLimit: 512Mi }
---
apiVersion: v1
kind: Service
metadata: { name: automation }
spec:
  selector: { app: auto-test-automation }
  ports: [{ name: http, port: 4501, targetPort: http }]
---
# Every ready automation pod, for CASEHUB_AUTOMATION_URL=dns+http://automation-nodes:4501.
apiVersion: v1
kind: Service
metadata: { name: automation-nodes }
spec:
  clusterIP: None
  selector: { app: auto-test-automation }
  ports: [{ name: http, port: 4501, targetPort: http }]
