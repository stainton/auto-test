apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# planner, generator (with healer) and executor each run in their own pod;
# general-agent serves CaseHub's model-only calls. automation/ is the optional
# single-pod alternative and is not included here.
resources:
  - planner
  - generator
  - executor
  - general-agent
